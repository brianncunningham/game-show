<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TToTO — Combo A+B reference implementation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
  /* ===================================================================
     TToTO — "Combo A+B" reference implementation
     Confirmed visual direction: Tri-Split Signal's saturated HUD panels +
     chevron cuts, carrying Split-Flap's letter-tile mechanic.
     This file is a cleaned, standalone extract of the working canvas
     mockup -- no design-tool wrapper, safe to copy into the real build.
     =================================================================== */

  * { box-sizing: border-box; }
  body { margin: 0; }

  .ttoto-a-panel {
    clip-path: polygon(24px 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%, 0 24px);
  }
  .ttoto-a-tag {
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 100%, 0 100%);
  }
  .ttoto-a-bracket-tr { position:absolute; top:16px; right:16px; width:26px; height:26px; }
  .ttoto-a-bracket-bl { position:absolute; bottom:16px; left:16px; width:26px; height:26px; }
  .score-plate {
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%, 0 14px);
    position:relative; padding:14px 26px 12px 26px; min-width:190px;
  }

  /* --- split-flap letter tiles ---------------------------------------
     Each tile is a 2-sided rotating card: .face.front shows the CURRENT
     letter, .face.back is pre-rotated 180deg and holds the NEXT letter.
     A half-turn of .flap-card hands off from one face to the other with
     no fade and no invisible gap -- see cascadeRow()/flipTileTo() below. */
  .flap-row { display:flex; justify-content:center; }
  .flap-cell { position:relative; border-radius:3px; filter: drop-shadow(0 4px 3px rgba(0,0,0,0.45)); perspective:340px; }
  .flap-cell::after { content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:rgba(0,0,0,0.5); transform:translateY(-1px); z-index:5; pointer-events:none; }
  .flap-card { position:absolute; inset:0; transform-style:preserve-3d; transform:rotateX(0deg); }
  .face { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Barlow Condensed', sans-serif; font-weight:700; font-size:32px; border-radius:3px; backface-visibility:hidden; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4); }
  .face.front { transform:rotateX(0deg); }
  .face.back  { transform:rotateX(180deg); }
  .face-this  { background:linear-gradient(to bottom,#8a3a37 0 50%,#5c221f 50% 100%); color:#ffd8d6; }
  .face-that  { background:linear-gradient(to bottom,#f0ae4e 0 50%,#d38a26 50% 100%); color:#2a1a04; }
  .face-other { background:linear-gradient(to bottom,#4fb9cf 0 50%,#237e8f 50% 100%); color:#06222a; }
</style>
</head>
<body>
<div style="width:1600px; height:900px; background: linear-gradient(135deg, #0a3145 0%, #12233f 32%, #1c1030 68%, #12070f 100%); font-family:'Barlow Condensed', system-ui, sans-serif; color:#f2f5fb; position:relative; overflow:hidden;">
  <div style="position:absolute; inset:0; background-image:
      radial-gradient(circle at 12% 90%, rgba(62,194,217,0.30), transparent 46%),
      radial-gradient(circle at 90% 8%, rgba(255,176,32,0.26), transparent 46%),
      radial-gradient(circle at 92% 90%, rgba(224,98,95,0.20), transparent 42%),
      repeating-linear-gradient(180deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(0deg, rgba(140,190,220,0.07) 0px, rgba(140,190,220,0.07) 1px, transparent 1px, transparent 64px),
      repeating-linear-gradient(90deg, rgba(140,190,220,0.07) 0px, rgba(140,190,220,0.07) 1px, transparent 1px, transparent 64px);"></div>

  <div style="position:relative; height:12px; background:linear-gradient(90deg, #e0625f, #ffb020, #3ec2d9); box-shadow:0 0 22px rgba(255,176,32,0.35);"></div>

  <!-- HEADER: score plates flanking the logo lockup + round-type badge
       (round TYPE is the dominant element, round NUMBER is the small pill above it) -->
  <div style="position:relative; display:flex; align-items:center; justify-content:space-between; padding:20px 32px 0 32px;">

    <div class="score-plate" id="score-team1" style="background:linear-gradient(160deg, #1a4a44, #0c2622); border:2px solid #3ec2d9; box-shadow:0 0 30px rgba(62,194,217,0.28);">
      <div style="font-size:16px; letter-spacing:3px; color:#8fe9dc;">TEAM 1</div>
      <div class="score-value" style="font-family:'Big Shoulders Display', sans-serif; font-weight:900; font-size:92px; line-height:0.95; color:#ffffff; text-shadow:0 0 26px rgba(62,194,217,0.6);">20</div>
    </div>

    <div style="text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <svg width="52" height="52" viewBox="0 0 64 64" style="flex:none;">
          <g stroke-width="7" stroke-linecap="round" fill="none">
            <path d="M14 12 L34 32 L14 52" stroke="#e0625f" transform="rotate(0 32 32)"/>
            <path d="M14 12 L34 32 L14 52" stroke="#ffb020" transform="rotate(120 32 32)"/>
            <path d="M14 12 L34 32 L14 52" stroke="#3ec2d9" transform="rotate(240 32 32)"/>
          </g>
        </svg>
        <div style="font-family:'Big Shoulders Display', sans-serif; font-weight:900; font-size:56px; letter-spacing:1px; line-height:1;">
          <span style="color:#e0625f;">T</span><span style="color:#ffb020;">T</span><span style="color:#c7d4ea; font-size:0.68em;">o</span><span style="color:#f2f5fb;">T</span><span style="color:#3ec2d9;">O</span>
        </div>
      </div>
      <div style="font-size:14px; letter-spacing:4px; color:#8ea3c4;">THIS &middot; THAT &middot; OR THE OTHER</div>
      <div class="ttoto-a-tag" id="round-number" style="background:#ffb020; color:#2e1c06; font-size:13px; font-weight:700; letter-spacing:3px; padding:5px 20px 5px 12px; margin-top:2px;">ROUND 2</div>
      <div id="round-type" style="font-family:'Big Shoulders Display', sans-serif; font-weight:900; font-size:38px; letter-spacing:1px; color:#ffffff; text-shadow:0 0 24px rgba(255,176,32,0.5);">STRAIGHT TRIVIA</div>
    </div>

    <div class="score-plate" id="score-team2" style="background:linear-gradient(160deg, #4a3410, #26190a); border:2px solid #ffb020; box-shadow:0 0 30px rgba(255,176,32,0.28); text-align:right;">
      <div style="font-size:16px; letter-spacing:3px; color:#ffd98a;">TEAM 2</div>
      <div class="score-value" style="font-family:'Big Shoulders Display', sans-serif; font-weight:900; font-size:92px; line-height:0.95; color:#ffffff; text-shadow:0 0 26px rgba(255,176,32,0.6);">10</div>
    </div>
  </div>

  <div style="position:relative; margin:20px 32px 0 32px; background:linear-gradient(125deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 32%), linear-gradient(90deg, #16324a, #1c2540); border:1px solid #4a6a95; box-shadow:0 0 26px rgba(120,170,230,0.2); padding:16px 28px 20px 28px;" class="ttoto-a-panel">
    <div class="ttoto-a-tag" style="background:#c7d4ea; color:#0d1b2e; font-size:13px; font-weight:800; letter-spacing:3px; padding:5px 18px 5px 12px; display:inline-block; margin-bottom:10px;">QUESTION</div>
    <div id="prompt-text" style="font-family:'Big Shoulders Display', sans-serif; font-weight:800; font-size:38px; letter-spacing:0.5px; text-align:center; color:#ffffff;">WHICH PLANET IS CLOSEST TO THE SUN?</div>
  </div>

  <div style="position:relative; display:flex; gap:20px; margin:22px 32px 0 32px; height:508px;">

    <!-- THIS panel -- shown here in the "missed" state; SIGNAL LOST / crack
         graphic is what a wrong answer looks like. Swap the crack <svg>'s
         "d" attributes to any of the variants in the crack library (see
         the implementation notes doc, section 5) rather than always using
         this one shape. -->
    <div class="ttoto-a-panel" style="flex:1; background:linear-gradient(125deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 36%), linear-gradient(160deg, #4a1418, #2a0c10); border:2px solid #e0625f; position:relative; padding:22px; display:flex; flex-direction:column; justify-content:space-between; filter:drop-shadow(0 12px 0 rgba(0,0,0,0.4)) drop-shadow(0 0 24px rgba(224,98,95,0.22));">
      <div class="ttoto-a-bracket-tr" style="border-top:3px solid #f5a8a5; border-right:3px solid #f5a8a5;"></div>
      <div class="ttoto-a-bracket-bl" style="border-bottom:3px solid #f5a8a5; border-left:3px solid #f5a8a5;"></div>
      <div class="ttoto-a-tag" style="background:#e0625f; color:#3a0f0f; font-size:16px; font-weight:700; letter-spacing:3px; padding:9px 24px 9px 16px; align-self:flex-start;">THIS</div>
      <div style="position:absolute; top:16px; right:50px; font-size:13px; letter-spacing:2px; color:#ffd0ce;">SIGNAL LOST</div>
      <div style="position:absolute; top:60px; left:6%; width:88%; height:420px; z-index:3;">
        <svg viewBox="0 0 380 420" preserveAspectRatio="none" style="width:100%; height:100%; overflow:visible; display:block;">
          <path d="M30,20 L100,65 L60,115 L140,150 L90,200 L180,235 L130,285 L210,320 L160,365 L250,395" fill="none" stroke="#ffb3b0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.28" style="filter:blur(3px);"/>
          <path d="M30,20 L100,65 L60,115 L140,150 L90,200 L180,235 L130,285 L210,320 L160,365 L250,395" fill="none" stroke="#fff3f2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
          <path d="M140,150 L190,122 L228,102" fill="none" stroke="#ffb3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
          <path d="M90,200 L40,220 L12,255" fill="none" stroke="#ffb3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
          <path d="M210,320 L268,296 L306,312" fill="none" stroke="#ffb3b0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
        </svg>
      </div>
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:36px;">
        <div class="flap-row" id="row-this" style="gap:6px;"></div>
        <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffd8d6" stroke-width="2.5" stroke-linecap="round"><path d="M5 5 L19 19 M19 5 L5 19"/></svg>
          <div style="font-size:17px; letter-spacing:2px; color:#ffd8d6;">TEAM 1 &mdash; MISSED</div>
        </div>
      </div>
    </div>

    <!-- THAT panel -- "active/locked" state -->
    <div class="ttoto-a-panel" style="flex:1; background:linear-gradient(125deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0) 36%), linear-gradient(160deg, #5a3a08, #2e1c06); border:2px solid #ffb020; box-shadow:0 0 46px rgba(255,176,32,0.4); position:relative; padding:22px; display:flex; flex-direction:column; justify-content:space-between; filter:drop-shadow(0 14px 0 rgba(0,0,0,0.45)) drop-shadow(0 0 30px rgba(255,176,32,0.3));">
      <div class="ttoto-a-bracket-tr" style="border-top:3px solid #ffd98a; border-right:3px solid #ffd98a;"></div>
      <div class="ttoto-a-bracket-bl" style="border-bottom:3px solid #ffd98a; border-left:3px solid #ffd98a;"></div>
      <div class="ttoto-a-tag" style="background:#ffb020; color:#2e1c06; font-size:16px; letter-spacing:3px; padding:9px 24px 9px 16px; align-self:flex-start; font-weight:700;">THAT</div>
      <div style="position:absolute; top:16px; right:50px; font-size:13px; letter-spacing:2px; color:#ffe6b3;">SIGNAL LOCKED</div>
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:36px;">
        <div class="flap-row" id="row-that" style="gap:6px;"></div>
        <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
          <div style="width:10px; height:10px; border-radius:50%; background:#ffb020; box-shadow:0 0 12px rgba(255,176,32,0.9);"></div>
          <div style="font-size:17px; letter-spacing:2px; color:#ffd98a;">TEAM 2 &mdash; ON THE CLOCK</div>
        </div>
      </div>
    </div>

    <!-- THE OTHER panel -- "idle/standby" state -->
    <div class="ttoto-a-panel" style="flex:1; background:linear-gradient(125deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 36%), linear-gradient(160deg, #0e3a4c, #0a1c28); border:2px solid #3ec2d9; position:relative; padding:22px; display:flex; flex-direction:column; justify-content:space-between; filter:drop-shadow(0 12px 0 rgba(0,0,0,0.4)) drop-shadow(0 0 24px rgba(62,194,217,0.2));">
      <div class="ttoto-a-bracket-tr" style="border-top:3px solid #9be6f2; border-right:3px solid #9be6f2;"></div>
      <div class="ttoto-a-bracket-bl" style="border-bottom:3px solid #9be6f2; border-left:3px solid #9be6f2;"></div>
      <div class="ttoto-a-tag" style="background:#3ec2d9; color:#062a33; font-size:16px; letter-spacing:3px; padding:9px 24px 9px 16px; align-self:flex-start; font-weight:700;">THE OTHER</div>
      <div style="position:absolute; top:16px; right:50px; font-size:13px; letter-spacing:2px; color:#bdeef7;">STANDBY</div>
      <div style="flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:36px;">
        <div class="flap-row" id="row-other" style="gap:6px;"></div>
        <div style="display:flex; align-items:center; justify-content:center; gap:10px;">
          <div style="width:10px; height:10px; border-radius:50%; background:#3ec2d9; box-shadow:0 0 10px rgba(62,194,217,0.7);"></div>
          <div style="font-size:17px; letter-spacing:2px; color:#bdeef7;">AVAILABLE</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
/* =====================================================================
   TToTOFlipBoard -- reusable split-flap cascade module.
   Not tied to this specific screen: pass it any .flap-row element and a
   target word and it builds/animates the tiles. Real game code should
   call cascadeRow() once per round load (when the host reveals/advances
   to a new prompt), not loop it -- the auto-demo at the bottom of this
   file loops only so this reference file plays itself back for review.
   ===================================================================== */
window.TToTOFlipBoard = (function(){
  var CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function randLetter(exclude){
    var c;
    do { c = CHARS[Math.floor(Math.random() * CHARS.length)]; } while (c === exclude);
    return c;
  }
  function sleep(ms){ return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

  // Builds (or rebuilds) the tile markup for a row to match a given word
  // length + color variant ('this' | 'that' | 'other'), all tiles reset
  // to a blank dash. Call this whenever the row needs to show a new,
  // different-length word (e.g. a new question).
  function buildRow(rowEl, wordLength, variant, tileSize){
    tileSize = tileSize || { width: 56, height: 94 };
    var html = '';
    for (var i = 0; i < wordLength; i++){
      html += '<div class="flap-cell" style="width:' + tileSize.width + 'px; height:' + tileSize.height + 'px;">' +
                '<div class="flap-card">' +
                  '<div class="face front face-' + variant + '">&ndash;</div>' +
                  '<div class="face back face-' + variant + '">&ndash;</div>' +
                '</div>' +
              '</div>';
    }
    rowEl.innerHTML = html;
  }

  // One physical flip: back face gets the new letter, the card rotates a
  // half-turn so front (old letter) swings away edge-on exactly as back
  // (new letter) swings into view from its own edge-on side.
  function flipTileTo(cell, letter, durationMs){
    return new Promise(function(resolve){
      var card = cell.querySelector('.flap-card');
      var front = cell.querySelector('.face.front');
      var back = cell.querySelector('.face.back');
      back.textContent = letter;
      card.style.transition = 'transform ' + durationMs + 'ms cubic-bezier(.36,.1,.2,1)';
      void card.offsetWidth;
      card.style.transform = 'rotateX(-180deg)';

      function onEnd(e){
        if (e.propertyName !== 'transform') return;
        card.removeEventListener('transitionend', onEnd);
        card.style.transition = 'none';
        card.style.transform = 'rotateX(0deg)';
        void card.offsetWidth;
        front.textContent = letter;
        resolve();
      }
      card.addEventListener('transitionend', onEnd);
    });
  }

  async function runTile(cell, target, stepMs, minSteps, maxSteps, startDelay){
    await sleep(startDelay);
    var steps = minSteps + Math.floor(Math.random() * (maxSteps - minSteps + 1));
    var current = cell.querySelector('.face.front').textContent;
    for (var i = 0; i < steps; i++){
      var letter = (i === steps - 1) ? target : randLetter(current);
      await flipTileTo(cell, letter, stepMs);
      current = letter;
    }
  }

  function resetRow(rowEl){
    rowEl.querySelectorAll('.flap-cell').forEach(function(cell){
      var card = cell.querySelector('.flap-card');
      card.style.transition = 'none';
      card.style.transform = 'rotateX(0deg)';
      cell.querySelector('.face.front').textContent = '–';
      cell.querySelector('.face.back').textContent = '–';
    });
  }

  // Public entry point: cascadeRow(rowEl, 'MERCURY', 'that')
  // rowEl must already contain exactly word.length .flap-cell elements
  // (call buildRow() first if the row's tile count needs to change).
  function cascadeRow(rowEl, word, opts){
    opts = opts || {};
    var stepMs = opts.stepMs || 150;
    var minSteps = opts.minSteps || 5;
    var maxSteps = opts.maxSteps || 11;
    var maxStartDelay = opts.maxStartDelay || 260;
    var cells = rowEl.querySelectorAll('.flap-cell');
    word.split('').forEach(function(ch, idx){
      if (!cells[idx]) return;
      var startDelay = Math.random() * maxStartDelay;
      runTile(cells[idx], ch, stepMs, minSteps, maxSteps, startDelay);
    });
  }

  return { buildRow: buildRow, cascadeRow: cascadeRow, resetRow: resetRow };
})();

/* --- DEMO ONLY: builds the three rows and loops them so this file plays
   itself back for review. Delete this block in the real integration --
   call TToTOFlipBoard.buildRow() + .cascadeRow() from your own round-load
   logic instead. */
(function demo(){
  var rows = {
    'row-this':  { word: 'VENUS',    variant: 'this'  },
    'row-that':  { word: 'MERCURY',  variant: 'that'  },
    'row-other': { word: 'EARTH',    variant: 'other' }
  };
  Object.keys(rows).forEach(function(id){
    var el = document.getElementById(id);
    TToTOFlipBoard.buildRow(el, rows[id].word.length, rows[id].variant);
  });

  function loop(){
    Object.keys(rows).forEach(function(id){
      TToTOFlipBoard.cascadeRow(document.getElementById(id), rows[id].word);
    });
    setTimeout(function(){
      Object.keys(rows).forEach(function(id){
        TToTOFlipBoard.resetRow(document.getElementById(id));
      });
      setTimeout(loop, 900);
    }, 4200);
  }
  window.addEventListener('load', function(){ setTimeout(loop, 300); });
})();
</script>
</body>
</html>
